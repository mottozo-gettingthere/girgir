<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Girgir diagnostics</title>
<style>
  :root { color-scheme: dark; --bg:#0a0e10; --panel:#111a1e; --line:#24343b;
          --fg:#e8f0f2; --muted:#7d939b; --ok:#4fb6a3; --no:#e2574c; --maybe:#f0a830; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px ui-monospace,SFMono-Regular,Menlo,monospace;
         padding: max(16px, env(safe-area-inset-left)) 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size:18px; margin:18px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 18px; font-size:12px; line-height:1.5; }
  h2 { font-size:11px; letter-spacing:.16em; color:var(--maybe); margin:22px 0 8px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
         padding:9px 0; border-bottom:1px solid var(--line); }
  .name { min-width:0; }
  .name b { font-weight:600; display:block; }
  .name small { color:var(--muted); font-size:11px; display:block; margin-top:2px; line-height:1.4; word-break:break-word; }
  .tag { flex:none; font-size:10px; font-weight:600; letter-spacing:.1em; padding:3px 8px; border-radius:999px; border:1px solid; }
  .yes { color:var(--ok); border-color:var(--ok); }
  .no  { color:var(--no); border-color:var(--no); }
  .mid { color:var(--maybe); border-color:var(--maybe); }
  button { font:inherit; background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:8px; padding:12px 16px; margin:6px 6px 0 0; cursor:pointer; }
  #ua { color:var(--muted); font-size:11px; word-break:break-all; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>
<h1>Girgir diagnostics</h1>
<p class="sub">Open this on each phone. It checks only what the app actually relies on. Nothing is sent anywhere and nothing is stored.</p>

<div id="out"></div>

<h2>LIVE TESTS</h2>
<button id="bMic">Test microphone</button>
<button id="bBuzz">Test vibration</button>
<button id="bTone">Test tone</button>
<button id="bNet">Test local address</button>
<button id="bScan">Test QR scanner</button>
<div id="live"></div>

<p id="ua"></p>

<script src="vendor/qrcode.js"></script>
<script>
const out = document.getElementById('out');
const live = document.getElementById('live');

function row(name, state, detail, parent) {
  const cls = state === true ? 'yes' : state === false ? 'no' : 'mid';
  const label = state === true ? 'YES' : state === false ? 'NO' : String(state);
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<span class="name"><b></b><small></small></span><span class="tag ' + cls + '"></span>';
  d.querySelector('b').textContent = name;
  d.querySelector('small').textContent = detail || '';
  d.querySelector('.tag').textContent = label;
  (parent || out).appendChild(d);
  return d;
}
function head(t) {
  const h = document.createElement('h2');
  h.textContent = t;
  out.appendChild(h);
}

(async () => {
  head('CORE — the app cannot run without these');
  row('Secure context', !!window.isSecureContext, location.protocol + '//' + location.hostname);
  row('getUserMedia', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), 'microphone access');
  row('RTCPeerConnection', !!window.RTCPeerConnection, 'the audio link itself');
  row('CompressionStream', (() => { try { new CompressionStream('deflate-raw'); return true; } catch (e) { return false; } })(), 'shrinks the pairing QR');
  row('Service worker', 'serviceWorker' in navigator, 'offline caching');
  let reg = null;
  try { reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); } catch (e) {}
  row('Worker registered', !!reg, reg ? reg.scope : 'visit the app itself first');

  head('PAIRING');
  let formats = [];
  const hasBD = 'BarcodeDetector' in window;
  if (hasBD) { try { formats = await window.BarcodeDetector.getSupportedFormats(); } catch (e) {} }
  const qrNative = hasBD && formats.includes('qr_code');
  row('Native QR reader', qrNative, qrNative ? 'the 127 KB fallback is never downloaded' : 'fallback decoder will be cached instead');

  head('AUDIO OUTPUT — where the other voice comes out');
  const a = document.createElement('audio');
  let volOK = false;
  try { a.volume = 0.42; volOK = Math.abs(a.volume - 0.42) < 0.02; } catch (e) {}
  row('Software volume', volOK, volOK ? 'in-app volume slider works' : 'iOS ignores it — use the phone buttons');
  const sinkOK = typeof a.setSinkId === 'function';
  row('Choose output device', sinkOK, sinkOK ? 'an output picker is available' : 'routing is whatever the OS picks');
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  var hasAS = !!(navigator.audioSession && 'type' in navigator.audioSession);
  row('Choose earpiece/speaker', hasAS,
      hasAS ? 'audioSession can switch where sound comes out'
            : 'no audioSession - output is whatever the system picks');
  row('Default routing', iOS ? 'EARPIECE' : 'SPEAKER',
      iOS ? 'iOS sends call audio to the receiver — hold it to your ear'
          : 'Android uses the loudspeaker');

  head('EXTRAS — nice to have, not required');
  row('Vibration', !!navigator.vibrate, navigator.vibrate ? 'pings buzz' : 'iOS has no vibration API — pings are tone only');
  row('Battery level', !!navigator.getBattery, navigator.getBattery ? 'your level shows and is shared' : 'iOS cannot report battery to a web app');
  row('Screen wake lock', !!navigator.wakeLock, 'keeps the screen on mid-conversation');

  head('STORAGE');
  let usage = null;
  try { const e = await navigator.storage.estimate(); usage = e.usage; } catch (e) {}
  row('Usage readable', usage != null, usage != null ? Math.round(usage / 1024) + ' KB cached' : 'not reported');
  let lsCount = 0;
  try { lsCount = localStorage.length; } catch (e) {}
  row('Local storage items', lsCount === 0 ? true : String(lsCount), lsCount === 0 ? 'nothing stored' : 'entries present');

  document.getElementById('ua').textContent = navigator.userAgent;
})();

document.getElementById('bMic').onclick = async () => {
  live.innerHTML = '';
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true } });
    const t = s.getAudioTracks()[0];
    row('Microphone opened', true, 'device: ' + (t.label || 'unnamed'), live);
    const devs = await navigator.mediaDevices.enumerateDevices();
    row('Inputs seen', String(devs.filter(d => d.kind === 'audioinput').length),
        devs.filter(d => d.kind === 'audioinput').map(d => d.label || '(unnamed)').join(' · ') || 'none', live);
    row('Outputs seen', String(devs.filter(d => d.kind === 'audiooutput').length),
        devs.filter(d => d.kind === 'audiooutput').map(d => d.label || '(unnamed)').join(' · ') || 'iOS does not list outputs', live);
    s.getTracks().forEach(x => x.stop());
  } catch (e) {
    row('Microphone opened', false, e.name + ': ' + e.message, live);
  }
};

/* The test that matters when two phones exchange codes happily and then
   never connect: what address does this browser actually hand the other one?
   A .local name means the other side has to resolve it over mDNS, which many
   networks quietly drop. */
/* Decides, on this phone alone, whether its QR scanner actually works.

   Android's BarcodeDetector is backed by a Play Services module fetched on
   demand. When that module is absent the object still exists, still lists
   qr_code, still constructs - and returns an empty array for every frame for
   ever. Nothing about the camera looks wrong, which is what made this so slow
   to find. Here the phone is handed a QR code it cannot miss: a clean one
   drawn on a canvas at the same density as a real pairing code. Anything but
   a decode is the decoder's fault, not the camera's. */
document.getElementById('bScan').onclick = async () => {
  live.innerHTML = '';
  const SAMPLE = 'E1OS' + 'A1b2C3-_x'.repeat(14).slice(0, 119);

  let canvas = null;
  try {
    const qr = qrcode(0, 'Q');
    qr.addData(SAMPLE, 'Byte');
    qr.make();
    const n = qr.getModuleCount(), quiet = 4, sc = Math.floor(900 / (n + quiet * 2));
    canvas = document.createElement('canvas');
    canvas.width = canvas.height = (n + quiet * 2) * sc;
    const g = canvas.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff'; g.fillRect(0, 0, canvas.width, canvas.height);
    g.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) g.fillRect((c + quiet) * sc, (r + quiet) * sc, sc, sc);
    row('Test code drawn', true, n + ' modules, the size a pairing code reaches', live);
  } catch (e) {
    row('Test code drawn', false, String(e && e.message || e), live);
    return;
  }

  let det = null, formats = [];
  try {
    if ('BarcodeDetector' in window) {
      formats = await window.BarcodeDetector.getSupportedFormats();
      if (formats.includes('qr_code')) det = new window.BarcodeDetector({ formats: ['qr_code'] });
    }
  } catch (e) { /* reported below */ }
  row("This phone's own QR reader", det ? 'PRESENT' : 'ABSENT',
      det ? 'says it can read QR codes' : 'the backup reader is used instead', live);

  if (det) {
    let found = null, threw = '';
    for (let i = 0; i < 5 && !found; i++) {
      try {
        const r = await det.detect(canvas);
        if (r && r.length) found = r[0].rawValue;
      } catch (e) { threw = String(e && e.message || e); break; }
    }
    row('  \u2514 does it actually read one', found === SAMPLE,
        found === SAMPLE ? 'working normally'
          : threw ? 'it failed: ' + threw
          : 'IT IS BROKEN \u2014 five clean attempts, nothing returned. This is the '
            + 'fault that leaves the camera running and never scanning.', live);
  }

  let haveJs = !!window.jsQR;
  if (!haveJs) {
    await new Promise(done => {
      const sc2 = document.createElement('script');
      sc2.src = 'vendor/jsQR.min.js';
      sc2.onload = sc2.onerror = done;
      document.head.appendChild(sc2);
    });
    haveJs = !!window.jsQR;
  }
  row('Backup QR reader', haveJs, haveJs ? 'available offline' : 'could not be loaded', live);

  if (haveJs) {
    const g = canvas.getContext('2d', { willReadFrequently: true });
    const img = g.getImageData(0, 0, canvas.width, canvas.height);
    let got = null;
    try { got = jsQR(img.data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' }); }
    catch (e) { /* reported below */ }
    row('  \u2514 does it actually read one', !!(got && got.data === SAMPLE),
        got && got.data === SAMPLE ? 'working \u2014 this phone can scan whatever its own reader does'
          : 'it could not read a perfect code, so the camera is not the problem', live);
  }
};

document.getElementById('bNet').onclick = async () => {
  live.innerHTML = '';
  let gotMic = false;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(x => x.stop());
    gotMic = true;
  } catch (e) { /* reported below */ }
  row('Microphone allowed', gotMic,
      gotMic ? 'browsers only reveal a real local address once it is'
             : 'without it the address is usually hidden', live);

  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.createDataChannel('probe');
  const seen = [];
  pc.onicecandidate = ev => {
    const c = ev.candidate && ev.candidate.candidate;
    if (!c) return;
    const m = c.match(/candidate:\S+ \d+ (\S+) \d+ (\S+) (\d+) typ (\w+)/);
    if (m) seen.push({ addr: m[2], typ: m[4] });
  };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise(done => {
    const check = () => { if (pc.iceGatheringState === 'complete') done(); };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(done, 4000);
  });

  const hosts = seen.filter(c => c.typ === 'host');
  row('Candidates gathered', hosts.length ? String(hosts.length) : false,
      hosts.length ? 'addresses this phone can be reached on'
                   : 'none at all \u2014 nothing for the other phone to connect to', live);

  const addrs = hosts.map(c => c.addr).filter((a, i, all) => all.indexOf(a) === i);
  if (!addrs.length) { row('Address offered', false, 'no host candidate', live); pc.close(); return; }

  addrs.forEach(a => {
    const k = classify(a);
    const name = k[0] === 'lan' ? 'Usable address'
      : k[0] === 'hidden' ? 'Address hidden'
      : k[0] === 'ipv6ll' || k[0] === 'ipv6ula' || k[0] === 'ipv6' ? 'IPv6 address'
      : 'Extra interface';
    row(name, k[0] === 'hidden' ? 'mDNS' : a, k[1], live);
  });

  /* A phone that fails on every network, a hotspot included, is not being
     blocked by any of them - something on the phone is answering for the
     network instead. That shows up here as an interface that has no business
     being in the list. A VPN is the usual one, and on Samsung handsets
     "Secure Wi-Fi" is a VPN under a name that does not sound like one. */
  const lan = addrs.filter(a => classify(a)[0] === 'lan');
  const odd = addrs.filter(a => ['public', 'cgnat', 'vpn'].includes(classify(a)[0]));

  if (odd.length) {
    row('Something else is on this phone', false,
        odd.join(', ') + ' \u2014 a VPN, Samsung Secure Wi-Fi, or mobile data left on. '
        + 'Turn those off and run this again: these should disappear.', live);
  }
  const hiddenCount = addrs.filter(a => classify(a)[0] === 'hidden').length;
  if (!lan.length && !hiddenCount) {
    row('No local address at all', false,
        'nothing here can reach another phone on the same Wi-Fi', live);
  } else if (lan.length > 1) {
    row('More than one local address', String(lan.length),
        lan.join(', ') + ' \u2014 the other phone may try the wrong one first', live);
  }
  pc.close();
};

/* Names each address rather than printing a bare number at someone. */
function classify(a) {
  if (/\.local$/i.test(a)) return ['hidden', 'hidden behind an mDNS name \u2014 allow the microphone, then retest'];
  if (a.indexOf(':') >= 0) {
    if (/^fe80:/i.test(a)) return ['ipv6ll', 'IPv6, link-local only'];
    if (/^(fc|fd)/i.test(a)) return ['ipv6ula', 'IPv6, private range'];
    return ['ipv6', 'IPv6, globally routable'];
  }
  const p = a.split('.').map(Number);
  if (p[0] === 192 && p[1] === 168) return ['lan', 'home or hotspot network'];
  if (p[0] === 10) return ['lan', 'private network'];
  if (p[0] === 172 && p[1] >= 16 && p[1] <= 31) return ['lan', 'private network'];
  if (p[0] === 169 && p[1] === 254) return ['selfassigned', 'self-assigned \u2014 this phone got no address'];
  if (p[0] === 100 && p[1] >= 64 && p[1] <= 127) return ['cgnat', 'carrier NAT, or a VPN such as Tailscale'];
  if (p[0] === 25) return ['vpn', 'a VPN range'];
  return ['public', 'a public address \u2014 mobile data, or a VPN'];
}

document.getElementById('bBuzz').onclick = () => {
  live.innerHTML = '';
  let ok = false;
  try { ok = !!(navigator.vibrate && navigator.vibrate([0, 160, 90, 160])); } catch (e) {}
  row('Vibration fired', ok, ok ? 'you should have felt two buzzes' : 'not supported on this phone', live);
};

document.getElementById('bTone').onclick = () => {
  live.innerHTML = '';
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    const ctx = new C();
    const t0 = ctx.currentTime;
    [[880, 0.42, 0.62], [1760, 0.12, 0.34]].forEach(([f, amp, dur]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(amp, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    });
    row('Tone played', true, 'rate ' + ctx.sampleRate + ' Hz — note which speaker it came from', live);
  } catch (e) {
    row('Tone played', false, e.message, live);
  }
};
</script>
</body>
</html>
